<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b5d55">
    <meta name="description" content="Book a fictional Wattle Bay Council hard-waste collection.">
    <title>Book a hard-waste pickup | Wattle Bay Council</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#" id="brand-link" aria-label="Wattle Bay Council hard-waste booking home">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>Wattle Bay</strong>
            <span>Council</span>
          </span>
        </a>
        <span class="service-name">Hard-waste collection</span>
      </div>
    </header>

    <div id="progress-region" class="progress-shell" hidden></div>

    <main id="main-content" tabindex="-1">
      <noscript>
        <section class="page-panel compact-panel">
          <p class="eyebrow">JavaScript required</p>
          <h1>Turn on JavaScript to book</h1>
          <p>This booking form stores your progress in this browser and needs JavaScript to move between steps.</p>
        </section>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p><strong>Wattle Bay Council</strong></p>
        <p>Fictional service demonstration · No information is sent to a council system</p>
      </div>
    </footer>
  </body>
</html>
